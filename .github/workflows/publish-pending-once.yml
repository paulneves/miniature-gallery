name: Publish pending miniatures once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pending-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish complete pending packages
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, unicodedata
          from pathlib import Path

          root = Path('.')
          uploads = root / 'uploads'
          catalog_path = root / 'catalog.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          miniatures = catalog.setdefault('miniatures', [])
          existing = {m.get('id') for m in miniatures}

          def slug(s):
              s = unicodedata.normalize('NFKD', s).encode('ascii','ignore').decode('ascii').lower()
              s = re.sub(r'[^a-z0-9]+', '-', s).strip('-')
              return s

          processed = []
          for mf in sorted(uploads.glob('*.json')):
              try:
                  m = json.loads(mf.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if m.get('schemaVersion') != 1 or not all(m.get(k) for k in ('id','title','universe','faction','subfaction')):
                  continue
              assets = m.get('assets') or {}
              required = [assets.get('miniature'), assets.get('thumbnail'), assets.get('paintingSheet')]
              if not all(required):
                  continue
              dest = root / 'images' / slug(m['universe']) / slug(m['faction']) / slug(m['subfaction'])
              dest.mkdir(parents=True, exist_ok=True)
              complete = True
              for name in required:
                  src = uploads / name
                  dst = dest / name
                  if src.exists():
                      if dst.exists():
                          src.unlink()
                      else:
                          src.replace(dst)
                  if not dst.exists() or dst.stat().st_size == 0:
                      complete = False
              if not complete:
                  continue
              if m['id'] not in existing:
                  thumb = f"images/{slug(m['universe'])}/{slug(m['faction'])}/{slug(m['subfaction'])}/{assets['thumbnail']}"
                  mini = f"images/{slug(m['universe'])}/{slug(m['faction'])}/{slug(m['subfaction'])}/{assets['miniature']}"
                  sheet = f"images/{slug(m['universe'])}/{slug(m['faction'])}/{slug(m['subfaction'])}/{assets['paintingSheet']}"
                  miniatures.append({
                      'id': m['id'], 'name': m['title'], 'universe': m['universe'],
                      'faction': m['faction'], 'subfaction': m['subfaction'],
                      'images': [
                          {'type':'miniature','thumbnail':thumb,'url':mini},
                          {'type':'painting-sheet','thumbnail':thumb,'url':sheet}
                      ]
                  })
                  existing.add(m['id'])
              mf.unlink()
              processed.append(m['id'])

          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
          print('Processed:', ', '.join(processed))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publish-pending-once.yml
          git add catalog.json images uploads || true
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Publish pending miniature packages'
            git push origin main
          fi
