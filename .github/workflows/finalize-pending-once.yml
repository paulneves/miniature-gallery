name: Finalize pending miniatures once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-pending-once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update catalog and finalize manifests
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, unicodedata
          from pathlib import Path
          root=Path('.')
          uploads=root/'uploads'
          cp=root/'catalog.json'
          catalog=json.loads(cp.read_text(encoding='utf-8'))
          arr=catalog.setdefault('miniatures',[])
          ids={x.get('id') for x in arr}
          def slug(s):
              if s == 'Warhammer 40,000': return 'warhammer-40000'
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode('ascii').lower()
              return re.sub(r'[^a-z0-9]+','-',s).strip('-')
          done=[]
          for mf in sorted(uploads.glob('*.json')):
              try: m=json.loads(mf.read_text(encoding='utf-8'))
              except Exception: continue
              if m.get('schemaVersion')!=1 or not all(m.get(k) for k in ('id','title','universe','faction','subfaction')): continue
              a=m.get('assets') or {}
              names=[a.get('miniature'),a.get('thumbnail'),a.get('paintingSheet')]
              if not all(names): continue
              d=root/'images'/slug(m['universe'])/slug(m['faction'])/slug(m['subfaction'])
              if not all((d/n).exists() and (d/n).stat().st_size>0 for n in names): continue
              if m['id'] not in ids:
                  base=f"images/{slug(m['universe'])}/{slug(m['faction'])}/{slug(m['subfaction'])}"
                  th=f"{base}/{a['thumbnail']}"
                  arr.append({'id':m['id'],'name':m['title'],'universe':m['universe'],'faction':m['faction'],'subfaction':m['subfaction'],'images':[{'type':'miniature','thumbnail':th,'url':f"{base}/{a['miniature']}"},{'type':'painting-sheet','thumbnail':th,'url':f"{base}/{a['paintingSheet']}"}]})
                  ids.add(m['id'])
              mf.unlink()
              done.append(m['id'])
          cp.write_text(json.dumps(catalog,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('Finalized:', ', '.join(done))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/finalize-pending-once.yml
          git add catalog.json uploads || true
          git commit -m 'Finalize pending miniature packages'
          git push origin main
