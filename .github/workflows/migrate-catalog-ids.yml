name: Migrate catalogue IDs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-catalog-ids.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Migrate catalogue IDs and image filenames
        run: python scripts/migrate_catalog_ids.py
      - name: Commit migration
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate catalogue to global prefixed IDs"
          git push
